[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-logistics-analytics"
version = "0.1.0"
description = "Análise reproduzível de entregas, frete e avaliações do e-commerce Olist."
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
validation = ["jsonschema>=4.23,<5"]
dashboard = ["streamlit>=1.55,<2"]

[project.scripts]
olist-logistics = "olist_logistics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
olist_logistics = ["sql/*.sql"]
